<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR名刺 - カスタムマーカー認識</title>
    <meta name="description" content="オリジナルマーカー画像を認識してモデルを表示するARアプリ">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <!-- FBXローダーの追加 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/loaders/FBXLoader.js"></script>
    <script>
      // FBXローダーコンポーネントの登録
      AFRAME.registerComponent('fbx-model', {
        schema: {
          src: {type: 'string'}
        },
        init: function () {
          this.loader = new THREE.FBXLoader();
          this.load();
        },
        load: function () {
          var self = this;
          var el = this.el;
          var src = this.data.src;
          
          if (!src) { return; }
          
          this.loader.load(src, function (object) {
            el.setObject3D('mesh', object);
            el.emit('model-loaded', {format: 'fbx', model: object});
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: true;">
      <!-- カスタムマーカーを定義 -->
      <a-marker type="pattern" url="./marker/pattern-marker.patt">
        <!-- マーカーが認識されたときに表示されるモデル -->
        <a-entity
          position="0 0 0"
          scale="0.01 0.01 0.01"
          fbx-model="src: models/dinosaur.fbx">
        </a-entity>
      </a-marker>
      
      <!-- カメラ -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
