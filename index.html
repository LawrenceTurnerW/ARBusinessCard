<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR名刺 - カスタムマーカー認識</title>
    <meta name="description" content="オリジナルマーカー画像を認識してモデルを表示するARアプリ">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script>
      // モデル読み込み後に明るさを調整するコンポーネント
      AFRAME.registerComponent('adjust-model', {
        init: function () {
          this.el.addEventListener('model-loaded', e => {
            const model = e.detail.model;
            console.log('モデルが読み込まれました - デバッグ情報:');
            console.log('モデル構造:', model);
            
            model.traverse(node => {
              if (node.isMesh) {
                console.log('メッシュ検出:', node.name);
                
                // マテリアルのデバッグ情報
                if (node.material) {
                  console.log('マテリアル情報:', node.material);
                  
                  // 基本色の設定（テクスチャが読み込めなくても白く表示されるように）
                  if (Array.isArray(node.material)) {
                    node.material.forEach(material => {
                      // 既存のテクスチャをチェック
                      if (material.map) {
                        console.log('テクスチャあり:', material.map.source);
                      } else {
                        console.log('テクスチャなし - 白色を適用');
                      }
                      
                      // 基本色を白に設定
                      material.color = new THREE.Color(1, 1, 1);
                      material.emissive = new THREE.Color(0.5, 0.5, 0.5);
                      material.emissiveIntensity = 1;
                    });
                  } else {
                    // 既存のテクスチャをチェック
                    if (node.material.map) {
                      console.log('テクスチャあり:', node.material.map.source);
                    } else {
                      console.log('テクスチャなし - 白色を適用');
                    }
                    
                    // 基本色を白に設定
                    node.material.color = new THREE.Color(1, 1, 1);
                    node.material.emissive = new THREE.Color(0.5, 0.5, 0.5);
                    node.material.emissiveIntensity = 1;
                  }
                } else {
                  console.log('マテリアルなし - 新規作成');
                  // マテリアルがない場合は新規作成
                  node.material = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    emissive: 0x555555,
                    emissiveIntensity: 1
                  });
                }
              }
            });
            
            console.log('モデルの処理が完了しました');
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: true;" renderer="colorManagement: true;">
      <!-- カスタムマーカーを定義 -->
      <a-marker type="pattern" url="marker/pattern-marker.patt">
        <!-- 強力なライト -->
        <a-entity light="type: ambient; color: #FFF; intensity: 2.0"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 1.5" position="1 1 1"></a-entity>
        <a-entity light="type: point; color: #FFF; intensity: 1.0; distance: 50" position="0 5 0"></a-entity>
        
        <!-- モデル -->
        <a-entity
          position="-1 0 1"
          scale="0.2 0.2 0.2"
          gltf-model="models/dinosaur.glb"
          adjust-model>
        </a-entity>
        <a-entity
          position="1 0 0"
          scale="0.8 0.8 0.8"
          gltf-model="models/human.glb"
          adjust-model
          animation-mixer>
        </a-entity>
      </a-marker>
      
      <!-- カメラ -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
