<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR名刺 - カスタムマーカー認識</title>
    <meta name="description" content="オリジナルマーカー画像を認識してモデルを表示するARアプリ">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script>
      // モデル読み込み後に明るさを調整するコンポーネント
      AFRAME.registerComponent('adjust-model', {
        init: function () {
          this.el.addEventListener('model-loaded', e => {
            const model = e.detail.model;
            console.log('モデルが読み込まれました - 明るく処理します');
            
            model.traverse(node => {
              if (node.isMesh && node.material) {
                // マテリアルがある場合は明るくする
                if (Array.isArray(node.material)) {
                  // 複数のマテリアルがある場合
                  node.material.forEach(material => {
                    if (material.color) {
                      material.color.multiplyScalar(22);
                    }
                    material.toneMapped = false;
                  });
                } else {
                  // 単一のマテリアルの場合
                  if (node.material.color) {
                    node.material.color.multiplyScalar(22);
                  }
                  node.material.toneMapped = false;
                }
              }
            });
            
            console.log('モデルの明るさ処理が完了しました');
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="colorManagement: true; physicallyCorrectLights: true; exposure: 2;">
      <!-- カスタムマーカーを定義 -->
      <a-marker type="pattern" url="marker/pattern-marker.patt">
        <!-- 周囲の光を追加 -->
        <a-entity light="type: ambient; color: #FFF; intensity: 2.0"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 1.5" position="1 1 1"></a-entity>
        
        <!-- マーカーが認識されたときに表示されるモデル -->
        <a-entity
          position="0 0 0"
          scale="5 5 5"
          gltf-model="models/dinosaur.glb"
          adjust-model>
        </a-entity>
      </a-marker>
      
      <!-- カメラ -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
