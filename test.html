<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>3Dモデル表示テスト - 超明るいテクスチャ</title>
    <meta name="description" content="マーカーなしで3Dモデルを表示するテスト">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script>
      // モデルをめっちゃ明るくするためのコンポーネント
      AFRAME.registerComponent('super-bright', {
        init: function () {
          this.el.addEventListener('model-loaded', e => {
            const model = e.detail.model;
            console.log('モデルが読み込まれました - 明るく処理します');
            
            model.traverse(node => {
              if (node.isMesh && node.material) {
                // メッシュのマテリアルを処理
                  
                  if (node.material.color) {
                    node.material.color.multiplyScalar(22);
                  }
                  
                  node.material.toneMapped = false;
              }
            });
            console.log('モデルの明るさ処理が完了しました');
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
      <!-- 3Dモデル - super-bright コンポーネントを追加 -->
      <a-entity
        position="0 0 -5"
        rotation="0 0 0"
        scale="5 5 5"
        gltf-model="models/dinosaur.glb"
        super-bright>
      </a-entity>
      
      <!-- カメラと操作コントロール - 近い位置に配置 -->
      <a-entity camera look-controls wasd-controls position="0 1.6 0"></a-entity>
      
      <!-- 白い床（反射による明るさ追加） -->
      <a-plane position="0 -1 0" rotation="-90 0 0" width="100" height="100" color="#FFFFFF" material="metalness: 0.3; roughness: 0.4"></a-plane>
      
      <!-- 明るい空 -->
      <a-sky color="#FFFFFF"></a-sky>
    </a-scene>
  </body>
</html>
